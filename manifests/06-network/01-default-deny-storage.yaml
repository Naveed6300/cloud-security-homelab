# Default-deny: select all pods in storage, allow nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: storage
spec:
  podSelector: {}        # empty = all pods in this namespace
  policyTypes:
    - Ingress
    - Egress
  # No rules — empty rules under policyTypes means deny.
