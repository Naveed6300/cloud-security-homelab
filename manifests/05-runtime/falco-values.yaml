# Falco Helm values — committable defaults.

driver:
  kind: modern_ebpf   # Use eBPF probe; never kernel module unless you have a specific reason.

# Falco itself
falco:
  json_output: true
  json_include_output_property: true
  log_level: info
  priority: debug   # forward all priorities; filter at Falcosidekick if needed

  # Default rule sources. The custom-rules.yaml ConfigMap (applied separately) appends to these.
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/k8s_audit_rules.yaml
    - /etc/falco/rules.d

# Resources — Falco is light but eBPF probe loading needs some headroom on first start
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1

# Falcosidekick — alert forwarder
falcosidekick:
  enabled: true
  fullfqdn: false
  replicaCount: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m

  # Local UI for browsing alerts during development
  webui:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

  config:
    # Backend selection — flip these on as you wire each
    elasticsearch:
      hostport: ""    # set in falcosidekick-secrets.yaml override
      index: "falco-events"
      minimumpriority: "notice"
      apikey: ""      # set in falcosidekick-secrets.yaml override
      mutualtls: false

    # Optional: also send to a webhook (Slack, generic webhook, etc.)
    webhook:
      address: ""
      minimumpriority: "warning"

# Custom rules ConfigMap — applied separately in custom-rules.yaml
customRules:
  custom-rules.yaml: |-
    - rule: Package manager run in container
      desc: Detects package manager execution inside a container (T1072)
      condition: >
        spawned_process and container and
        proc.name in (apk, apt, apt-get, yum, dnf, pip, pip3)
      output: >
        Package manager launched in container
        (user=%user.name proc=%proc.name cmd=%proc.cmdline
        container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [container, T1072, mitre_lateral_movement]

    - rule: Cloud credential file read
      desc: >
        Reading common cloud credential file paths in any container. Maps to
        MITRE ATT&CK T1552.001 (Credentials in Files).
      condition: >
        open_read and container and
        (fd.name endswith /.aws/credentials or
         fd.name endswith /.aws/config or
         fd.name endswith /.azure/credentials or
         fd.name endswith /.mc/config.json or
         fd.name endswith /.config/gcloud/credentials.db)
      output: >
        Cloud credential file read
        (user=%user.name proc=%proc.name file=%fd.name
         container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [credentials, mitre_credential_access, T1552_001]

    - rule: Unauthorized write to Postgres data dir
      desc: Detect writes to /var/lib/postgresql/data by anything other than postgres
      condition: >
        open_write and container and
        fd.name startswith /var/lib/postgresql/data and
        not proc.name in (postgres, pg_ctl, initdb, pg_basebackup)
      output: >
        Unexpected write to Postgres data dir
        (user=%user.name proc=%proc.name file=%fd.name container=%container.name)
      priority: WARNING
      tags: [database, integrity, mitre_impact]
    # Custom rules are mounted via a separate ConfigMap; this section is the
    # in-chart fallback. We use the external ConfigMap for clarity.

falcosidekick:
   webui:
      ingress:
         enabled: true
         annotations:
            kubernetes.io/ingress.class: traefik
         hosts:
           - host: falco.lab.home.arpa
             paths:
               - path: /
                 pathType: Prefix
