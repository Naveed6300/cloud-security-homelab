apiVersion: v1
kind: Namespace
metadata:
  name: storage
  labels:
    purpose: storage
    # Pod Security Standards — see https://kubernetes.io/docs/concepts/security/pod-security-standards/
    # baseline blocks the most-known-bad: privileged containers, hostPath, hostNetwork, hostPID, hostIPC.
    # Phase 04's OPA Gatekeeper policies layer additional admission rules on top.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
